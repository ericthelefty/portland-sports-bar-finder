name: ci
# Builds the app and tests every flow against a real Postgres database on each push.
# Results and screenshots are saved to the ci-results branch.
on:
  push:
    branches-ignore: [ci-results]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      ADMIN_PASSWORD: ci-test-password-123
      SITE_URL: http://localhost:3000
      BASE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          mkdir -p out
          echo "sha=$GITHUB_SHA" > out/summary.txt
          npm install --no-audit --no-fund 2>&1 | tee out/install.log
          node -e "const d=require('./node_modules/next/dist/compiled/@next/font/dist/google/font-data.json');console.log(Object.keys(d).filter(k=>/Shoulders/.test(k)).map(k=>k+' '+JSON.stringify(d[k].weights)).join('\n'))" > out/fonts.txt 2>&1 || true
      - name: Build
        run: npm run build 2>&1 | tee out/build.log
      - name: Install browser
        run: npx playwright install --with-deps chromium > out/playwright-install.log 2>&1
      - name: Test
        run: |
          npm start > out/server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/privacy && break; sleep 1; done
          node scripts/e2e.mjs 2>&1 | tee out/e2e.log
      - name: Publish results
        if: always()
        run: |
          echo "status=${{ job.status }}" >> out/summary.txt
          cp package-lock.json out/ 2>/dev/null || true
          mkdir -p /tmp/results && cp -r out/. /tmp/results/
          cd /tmp/results && git init -q && git checkout -q -b ci-results
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "ci results $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-results
